name: Shared S24 Ultra Validation

on:
  workflow_call:

jobs:
  build-and-verify:
    # macOS runners are required to run hardware-accelerated Android emulators
    runs-on: macos-latest

    steps:
    # 1. Download the code from the calling repository
    - name: Checkout Caller Code
      uses: actions/checkout@v4

    # 2. Set up Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. Fix execution permissions for the Gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # 4. Boot the emulator and automatically run screen/UI tests
    - name: Boot S24 Ultra Emulator & Run UI Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34          # Matches S24 Ultra launch OS (Android 14)
        target: google_apis
        arch: x86_64
        disable-animations: true # Speeds up UI interactions and prevents flaky tests
        script: |
          echo "Emulator is live. Running instrumented screen tests..."
          ./gradlew connectedCheck
