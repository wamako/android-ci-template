name: Shared S24 Ultra Validation

on:
  workflow_call:

jobs:
  build-and-verify:
    runs-on: macos-14

    steps:
    - name: Checkout Caller Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Boot Native S24 Ultra ARM64 Emulator & Run UI Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 37
        target: google_apis
        arch: arm64-v8a
        disable-animations: true
        script: |
          echo "ARM64 Emulator running Android 17 (API 37) booted successfully."
          
          echo "Step 1: Compiling both the main app and test APKs..."
          ./gradlew assembleDebug assembleDebugAndroidTest
          
          echo "Step 2: Installing the applications onto the virtual device..."
          ./gradlew installDebug installDebugAndroidTest
          
          echo "Step 3: Executing instrumented verification checks..."
          ./gradlew connectedCheck
