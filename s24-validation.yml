name: Shared S24 Ultra Validation

# This allows other repositories to call this workflow remotely
on:
  workflow_call:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Caller Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Test APK
      run: ./gradlew assembleDebug
